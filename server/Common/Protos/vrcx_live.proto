syntax = "proto3";

// The one websocket contract: /1/ws carries binary protobuf frames, one message per frame,
// ClientMessage in and ServerMessage out. Both envelopes are a oneof and grow by adding cases
// (never renumber, never reuse a number); the hellos carry a protocol version so either side
// can tell what the other speaks. Game-log batches and server events are the first two kinds
// of traffic, not the only ones. Request/response-shaped calls stay REST.
package vrcx.live;

option csharp_namespace = "VRCX.Common.Live";

import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Client -> server

message ClientMessage {
    oneof message {
        ClientHello hello = 1;
        GameLogBatch game_log = 2;
        Ping ping = 3;
        ActionResult action_result = 4;
        GameState game_state = 5;
        IpcPacket ipc = 6;
    }
}

// A packet another program wrote to the VRCX named pipe on this PC (the original's Dotnet/IPC and
// ipcEvent), parsed by the desktop app. docs/desktop-ipc.md maps the pipe's JSON to these cases;
// packets with no case here (the Photon stream, LaunchCommand) are not relayed.
message IpcPacket {
    // When the desktop app read it; unset means now.
    google.protobuf.Timestamp received_at = 1;
    oneof packet {
        // VrcxMessage, MsgType CustomTag. An empty tag removes the user's tag.
        IpcCustomTag custom_tag = 10;
        // VrcxMessage, MsgType ClearCustomTags.
        LogNoData clear_custom_tags = 11;
        // VrcxMessage, MsgType Noty: its Data becomes a game log Event.
        LogText noty = 12;
        // VrcxMessage, MsgType External: a game log External row.
        IpcExternal external = 13;
        // Ping: a Photon logger is connected, so Noty packets are its own and dropped.
        LogNoData ping = 14;
        // MsgPing: an external notifier and its version (above 21 it sends its own notifications).
        IpcMsgPing msg_ping = 15;
        // The Photon logger's stream (OnEvent, OnOperationResponse, VRCEvent, Event7List): the
        // packet's JSON as read, which the server parses as the original's photon store did.
        string photon_json = 16;
    }
}

message IpcCustomTag {
    string user_id = 1;
    string tag = 2;
    // A CSS colour, as sent (TagColour).
    string tag_colour = 3;
}

message IpcExternal {
    string user_id = 1;
    string display_name = 2;
    string message = 3;
    // Unset means true: whether it is also a notification.
    optional bool notify = 4;
}

message IpcMsgPing {
    int32 version = 1;
}

// What became of a ClientAction that carried a request_id.
message ActionResult {
    string request_id = 1;
    ActionStatus status = 2;
    string error = 3;
    // What the action read, as JSON, for the actions that read something (each one says its shape).
    string json = 4;
}

enum ActionStatus {
    ACTION_STATUS_UNSPECIFIED = 0;
    ACTION_STATUS_OK = 1;
    ACTION_STATUS_FAILED = 2;
    // A launch was refused because VRChat is already running and a second copy was not asked for.
    ACTION_STATUS_GAME_RUNNING = 3;
    // The agent does not do this action (an older agent, or not on this OS).
    ACTION_STATUS_UNSUPPORTED = 4;
    // A destructive action came without confirm set.
    ACTION_STATUS_NOT_CONFIRMED = 5;
    // What the action works on is not there (no VRChat registry, no cache entry, no config file).
    ACTION_STATUS_NOT_FOUND = 6;
}

// Whether VRChat is running on this PC. Sent after the hello and whenever it changes.
message GameState {
    bool running = 1;
    // Whether SteamVR (vrserver) runs on this PC (the original's IsSteamVRRunning).
    bool steamvr_running = 2;
    // Set when VRChat just stopped: whether it quit on its own (its log's last lines say so), the
    // original's VrcClosedGracefully. Unset while it runs or before it ran.
    optional bool closed_gracefully = 3;
    // The headset's proximity sensor says nobody wears it (the original's IsHmdAfk), while the
    // agent's OpenVR is active.
    bool hmd_afk = 4;
}

message ClientHello {
    // The highest protocol version the client understands (see PROTOCOL_VERSION below).
    uint32 protocol_version = 4;
    // Stable per-installation id (the desktop app's config), so the server keeps each
    // client's game-log state (current instance, who is in it) apart across reconnects.
    string client_id = 1;
    // "vrcx-desktop/2.0.0", "vrcx-web/2.0.0" - for logs only.
    string client_name = 2;
    // When false the server does not stream ServerEvents to this connection (a desktop app
    // that only ships logs). Default true.
    bool mute_events = 3;
    // The ClientAction cases this PC's agent carries out; the web client offers only those.
    repeated Capability capabilities = 5;
    // "windows" or "linux".
    string os = 6;
    // Where VRChat keeps its files on this PC, for display (the original's Get*Location).
    AgentFolders folders = 7;
    // The PC's offset from UTC in minutes, for the local dates the original puts in saved file names.
    sint32 utc_offset_minutes = 8;
}

message AgentFolders {
    string app_data = 1;
    string photos = 2;
    string screenshots = 3;
    string cache = 4;
    string ugc_photos = 5;
    string crash_dumps = 6;
}

// One per ClientAction family.
enum Capability {
    CAPABILITY_UNSPECIFIED = 0;
    // launch_vrchat, quit_vrchat
    CAPABILITY_LAUNCH = 1;
    // open_instance
    CAPABILITY_OPEN_INSTANCE = 2;
    // process_screenshot, delete_screenshot_metadata
    CAPABILITY_SCREENSHOTS = 3;
    // send_ipc
    CAPABILITY_IPC = 4;
    // open_folder
    CAPABILITY_FOLDERS = 5;
    // pick_path
    CAPABILITY_PICK_PATH = 6;
    // read_vrchat_config, write_vrchat_config
    CAPABILITY_VRCHAT_CONFIG = 7;
    // the registry actions
    CAPABILITY_REGISTRY = 8;
    // read_local_moderations, set_local_moderation
    CAPABILITY_LOCAL_MODERATIONS = 9;
    // the cache actions
    CAPABILITY_CACHE = 10;
    // save_media, crop_prints
    CAPABILITY_SAVE_MEDIA = 11;
    // show_notification
    CAPABILITY_NOTIFICATIONS = 12;
    // set_discord_presence
    CAPABILITY_DISCORD = 13;
    // open_calendar_file
    CAPABILITY_CALENDAR = 14;
    // apply_agent_settings
    CAPABILITY_SETTINGS = 15;
    // the agent runs OpenVR (HMD AFK; the VR overlays) when the settings ask for it
    CAPABILITY_OPENVR = 16;
}

message Ping {}

// Current protocol version, for both hellos.
enum ProtocolVersion {
    PROTOCOL_VERSION_UNSPECIFIED = 0;
    PROTOCOL_VERSION_1 = 1;
}

// In log order. The desktop app sends at most 1000 per batch.
message GameLogBatch {
    repeated LogEntry entries = 1;
}

// One parsed VRChat log line (desktop/src/log_parser.cpp). Carries no derived state: the
// server owns the VRChat API data and the session state needed to interpret these.
message LogEntry {
    google.protobuf.Timestamp created_at = 1;
    string file_name = 2;
    oneof entry {
        LogLocation location = 10;
        LogLocationDestination location_destination = 11;
        LogPlayer player_joined = 12;
        LogPlayer player_left = 13;
        LogNoData portal_spawn = 14;
        LogText event = 15;
        LogText vrcx = 16;
        LogVideoPlay video_play = 17;
        LogText video_sync = 18;
        LogText notification = 19;
        LogText api_request = 20;
        LogAvatarChange avatar_change = 21;
        LogText udon_exception = 22;
        LogNoData vrc_quit = 23;
        LogNoData openvr_init = 24;
        LogNoData desktop_mode = 25;
        LogText screenshot = 26;
        LogText resource_load_string = 27;
        LogText resource_load_image = 28;
        LogStickerSpawn sticker_spawn = 29;
        // The VRChat account signed in to the game on this PC.
        LogPlayer user_authenticated = 30;
        // A ProTV "nowplaying {json}" line (https://protv.dev/guides/nowplaying): the JSON.
        LogText now_playing = 31;
    }
}

message LogNoData {}

message LogText {
    string text = 1;
}

message LogLocation {
    string location = 1;
    string world_name = 2;
}

message LogLocationDestination {
    string location = 1;
}

message LogPlayer {
    string display_name = 1;
    string user_id = 2;
}

message LogVideoPlay {
    string video_url = 1;
    string display_name = 2;
}

message LogAvatarChange {
    string display_name = 1;
    string avatar_name = 2;
}

message LogStickerSpawn {
    string user_id = 1;
    string display_name = 2;
    string inventory_id = 3;
}

// ---------------------------------------------------------------------------
// Server -> client

message ServerMessage {
    oneof message {
        ServerHello hello = 1;
        GameLogAck game_log_ack = 2;
        ServerEvent event = 3;
        ClientAction action = 4;
        Pong pong = 5;
        GameLogResume game_log_resume = 6;
    }
}

// Answer to a ClientHello with a client_id: how far this client's log was ingested, so it
// only sends lines after last_entry_at (unset = send everything).
message GameLogResume {
    google.protobuf.Timestamp last_entry_at = 1;
    string account_id = 2;
    string current_instance_location = 3;
}

message ServerHello {
    // The protocol version the server speaks. Bumped when a case changes meaning, not when one is added.
    uint32 protocol_version = 3;
    string server_version = 1;
    // Accounts with a live VRChat session right now.
    repeated string account_ids = 2;
}

message Pong {}

message GameLogAck {
    int32 accepted = 1;
}

// A local action the server asks the gaming PC to perform - decided server-side,
// since it needs session state and settings the server owns.
message ClientAction {
    oneof action {
        ProcessScreenshot process_screenshot = 1;
        QuitVrchat quit_vrchat = 2;
        LaunchVrchat launch_vrchat = 3;
        OpenInstanceInGame open_instance = 4;
        SendIpc send_ipc = 6;
        OpenFolder open_folder = 7;
        PickPath pick_path = 8;
        LogNoData read_vrchat_config = 9;
        WriteVrchatConfig write_vrchat_config = 10;
        LogNoData read_vrchat_registry = 11;
        WriteVrchatRegistry write_vrchat_registry = 12;
        Confirm delete_vrchat_registry = 13;
        ReadVrchatRegistryKey read_vrchat_registry_key = 14;
        SetVrchatRegistryKey set_vrchat_registry_key = 15;
        ReadLocalModerations read_local_moderations = 16;
        SetLocalModeration set_local_moderation = 17;
        LogNoData get_cache_info = 18;
        CacheEntry check_cache = 19;
        CacheEntry delete_cache_entry = 20;
        Confirm clear_cache = 21;
        LogNoData sweep_cache = 22;
        DeleteScreenshotMetadata delete_screenshot_metadata = 23;
        SaveMedia save_media = 24;
        CropPrints crop_prints = 25;
        ShowNotification show_notification = 26;
        DiscordPresence set_discord_presence = 27;
        OpenCalendarFile open_calendar_file = 28;
        AgentSettings apply_agent_settings = 29;
        WristFeed update_wrist_feed = 30;
        HudFeed update_hud = 31;
        NowPlayingPie update_now_playing_pie = 32;
    }
    // Set when the server wants an ActionResult back.
    string request_id = 5;
}

message ProcessScreenshot {
    string path = 1;
    string metadata_json = 2;
    bool append_world_id = 3;
    string world_id = 4;
    bool copy_to_clipboard = 5;
}

message QuitVrchat {}

// Starts VRChat on this PC. How to start it (custom path, launch arguments) is this PC's own
// setting, never sent by the server, so a server can only ever start the game.
message LaunchVrchat {
    string launch_url = 1;
    bool desktop_mode = 2;
    bool allow_second_instance = 3;
}

// Writes one packet to every program connected to this PC's VRCX named pipe (the original's
// SendIpc and IPCAnnounceStart). Sent without a request_id: nobody answers.
message SendIpc {
    // The packet's Type: VrcxMessage or VRCXLaunch.
    string type = 1;
    string msg_type = 2;
    string data = 3;
}

// Folders the agent opens in the PC's file manager. Only these: the server never sends a path.
enum Folder {
    FOLDER_UNSPECIFIED = 0;
    FOLDER_PHOTOS = 1;
    FOLDER_SCREENSHOTS = 2;
    FOLDER_APP_DATA = 3;
    FOLDER_UGC_PHOTOS = 4;
    FOLDER_CRASH_DUMPS = 5;
    // The agent's own folder (the original's VRCX app data).
    FOLDER_AGENT_DATA = 6;
    // The app launcher's shortcut folder.
    FOLDER_SHORTCUTS = 7;
    FOLDER_CACHE = 8;
}

// Opens a folder (the original's Open*Folder); with relative_path, selects that item inside it
// (OpenFolderAndSelectItem). A relative path that leaves the folder is refused.
message OpenFolder {
    Folder folder = 1;
    string relative_path = 2;
}

enum PickPurpose {
    PICK_PURPOSE_UNSPECIFIED = 0;
    // The VRChat install folder or its launch.exe (the launch path override).
    PICK_PURPOSE_VRCHAT_PATH = 1;
    // The UGC photos folder override.
    PICK_PURPOSE_UGC_FOLDER = 2;
    // The app launcher's shortcut folder.
    PICK_PURPOSE_SHORTCUT_FOLDER = 3;
    // Any folder, only answered (config.json's cache and picture folders).
    PICK_PURPOSE_FOLDER = 4;
}

// Shows the native folder or file picker on the PC (OpenFolderSelectorDialog, OpenFileSelectorDialog)
// and keeps the choice as the agent's own setting for that purpose. Answers json {"path": "..."},
// empty when cancelled.
message PickPath {
    PickPurpose purpose = 1;
    // Where the picker opens (FOLDER only; the others know their own place).
    string start = 2;
}

message Confirm {
    // Set by the web client only after asking; without it the agent answers NOT_CONFIRMED.
    bool confirm = 1;
}

// Replaces VRChat's config.json (WriteConfigFile) with a JSON object; the agent checks it parses.
// read_vrchat_config answers json {"exists": bool, "json": "<the file>"}.
message WriteVrchatConfig {
    string json = 1;
}

// Restores a registry backup (SetVRChatRegistry): the JSON read_vrchat_registry answers, which is
// {"<key>": {"data": <value>, "type": 3 binary, 4 DWORD or 100 float}}; NOT_FOUND when VRChat has no key.
message WriteVrchatRegistry {
    string json = 1;
    bool confirm = 2;
}

// GetVRChatRegistryKey: answers json {"value": <value or null>}.
message ReadVrchatRegistryKey {
    string key = 1;
}

// SetVRChatRegistryKey: value_json is the value as JSON, type the RegistryValueKind number.
message SetVrchatRegistryKey {
    string key = 1;
    string value_json = 2;
    int32 type = 3;
}

// GetVRChatModerations: answers json {"<user id>": <type>}, the signed-in user's local show/hide
// avatar list.
message ReadLocalModerations {
    string current_user_id = 1;
}

// SetVRChatUserModeration.
message SetLocalModeration {
    string current_user_id = 1;
    string user_id = 2;
    int32 type = 3;
}

// One asset bundle in VRChat's cache (AssetBundleManager). check_cache answers json
// {"size": n, "locked": bool, "path": "..."}, size -1 when it is not cached. get_cache_info answers
// {"size": n, "location": "..."}; sweep_cache answers the removed folders as a JSON list.
message CacheEntry {
    string id = 1;
    int32 version = 2;
    string variant = 3;
    int32 variant_version = 4;
}

// DeleteScreenshotMetadata (one picture inside the screenshots folder) or, with all and confirm,
// DeleteAllScreenshotMetadata.
message DeleteScreenshotMetadata {
    string relative_path = 1;
    bool all = 2;
    bool confirm = 3;
}

enum MediaKind {
    MEDIA_KIND_UNSPECIFIED = 0;
    MEDIA_KIND_PRINT = 1;
    MEDIA_KIND_STICKER = 2;
    MEDIA_KIND_EMOJI = 3;
}

// SavePrintToFile, SaveStickerToFile, SaveEmojiToFile: writes data (the image the server downloaded
// from url) into the UGC folder, under kind and month_folder, unless the file is there. Answers json
// {"path": "..."}, the path empty when the file was there already.
message SaveMedia {
    MediaKind kind = 1;
    string url = 2;
    string month_folder = 3;
    string file_name = 4;
    // Crop a print to its picture (the crop prints setting).
    bool crop = 5;
    bytes data = 6;
}

// CropAllPrints over the UGC prints folder. Answers json {"cropped": n}.
message CropPrints {
    bool confirm = 1;
}

// A notification on the PC: the desktop toast (DesktopNotification), XSOverlay and OVR Toolkit.
message ShowNotification {
    string title = 1;
    string body = 2;
    // The image's URL, which the server downloads into image.
    string image_url = 3;
    bool desktop = 4;
    bool xsoverlay = 5;
    bool ovrtoolkit_hud = 6;
    bool ovrtoolkit_wrist = 7;
    // Seconds, for XSOverlay and OVR Toolkit.
    int32 timeout = 8;
    double opacity = 9;
    // The image's bytes; empty shows VRCX's icon on the overlays and none on the toast.
    bytes image = 10;
    // What XSOverlay and OVR Toolkit show (toNotificationText), under the title "VRCX".
    string overlay_text = 11;
    // The agent's own SteamVR HMD overlay (the original's overlayNotifications), at this Noty
    // layout (topCenter, bottomRight, ...) in the dark theme or not.
    bool steamvr_overlay = 12;
    string position = 13;
    bool dark = 14;
}

// Discord Rich Presence (Discord.SetAssets); active false clears it.
message DiscordPresence {
    bool active = 1;
    string details = 2;
    string state = 3;
    string large_image_key = 4;
    string large_image_text = 5;
    string small_image_key = 6;
    string small_image_text = 7;
    // Unix milliseconds; 0 leaves them out.
    int64 start_time = 8;
    int64 end_time = 9;
    string party_id = 10;
    int32 party_size = 11;
    int32 party_max = 12;
    string button_text = 13;
    string button_url = 14;
    string app_id = 15;
    // The world's page, linked from the details line; empty for none.
    string details_url = 16;
    // Discord's activity type: 0 playing, 2 listening, 3 watching, 5 competing.
    int32 activity_type = 17;
    // Which line Discord shows as the status: 0 the app's name, 1 state, 2 details.
    int32 status_display_type = 18;
}

// Opens an .ics with the PC's calendar app (OpenCalendarFile).
message OpenCalendarFile {
    string ics = 1;
}

// The agent's own behaviour, set in the web client's settings and kept by the agent.
message AgentSettings {
    // The app launcher (AutoAppLaunchManager): start the shortcuts in its folder with VRChat.
    bool app_launcher_enabled = 1;
    bool app_launcher_kill_on_exit = 2;
    bool app_launcher_run_once = 3;
    // Start VRChat again when it closes without quitting (relaunch after crash).
    bool relaunch_after_crash = 4;
    // Sweep VRChat's cache when it closes (auto cache management).
    bool auto_sweep_cache = 5;
    // The UGC photos folder override; empty means VRChat's own.
    string ugc_folder = 6;
    // OpenVR (the original's SetVR): on while SteamVR runs and VRChat runs in VR, or always.
    bool open_vr = 7;
    bool open_vr_always = 8;
    bool wrist_overlay = 9;
    // The wrist overlay shows while this controller button is held: menu, else grip (A/X on Oculus).
    bool overlay_menu_button = 10;
    // 0 either hand, 1 left, 2 right.
    int32 overlay_hand = 11;
}

// What plays in the game's instance (the original's nowPlayingUpdate): the wrist overlay's now
// playing row, and the HMD overlay's progress pie when `pie` is set. The agent turns the clock into
// the share played.
message NowPlayingPie {
    // False when nothing plays.
    bool active = 1;
    // Seconds into the video at logged_at.
    double position = 2;
    // Unix seconds.
    double logged_at = 3;
    double length = 4;
    double speed = 5;
    bool paused = 6;
    string name = 7;
    // progressPie, and with progressPieFilter a dance world.
    bool pie = 8;
}

// The HMD overlay's Photon HUDs (the original's addEntryHudFeed and updateHudTimeout): new events,
// newest first, already through the HUD filters, and the timeout list when it changed.
message HudFeed {
    repeated HudEntry added = 1;
    // How long an event line stays (photonOverlayMessageTimeout).
    int32 message_timeout_ms = 2;
    bool timeouts_set = 3;
    repeated HudTimeout timeouts = 4;
}

message HudEntry {
    string display_name = 1;
    // What happened, as the HUD line reads after the name.
    string text = 2;
    // "yellow" for the lines the original drew yellow.
    string color = 3;
    bool master = 4;
    bool moderator = 5;
    bool friend = 6;
    bool favorite = 7;
    // The name's custom tag colour, or empty.
    string colour = 8;
}

message HudTimeout {
    string display_name = 1;
    // Seconds since the player was last heard from.
    int32 seconds = 2;
}

// The wrist overlay's feed (the original's wristFeedUpdate): the newest rows first, already passed
// through the wrist feed filters, with how the overlay is drawn.
message WristFeed {
    repeated WristRow rows = 1;
    // VRCX_vrBackgroundEnabled: a dark panel behind the feed.
    bool background = 2;
    // VRCX_hideDevicesFromFeed.
    bool hide_devices = 3;
    // The player count with friends in brackets, as the bottom bar's first row starts.
    string status = 4;
    // When the game joined this instance and when it started (0 when unknown or hidden by
    // hideUptimeFromFeed), for the bottom bar's timers; Unix milliseconds.
    int64 location_since_ms = 5;
    int64 online_since_ms = 6;
    // pcUptimeOnFeed and vrOverlayCpuUsage: the agent adds its own PC's uptime and CPU load.
    bool pc_uptime = 7;
    bool cpu_usage = 8;
    // minimalFeed: the bottom bar without its labels.
    bool minimal = 9;
    int32 online_friends = 10;
    // The bottom bar's labels in the page's language: Timer, Players, CPU, Online.
    string timer_label = 11;
    string players_label = 12;
    string cpu_label = 13;
    string online_label = 14;
    // The clock in 12-hour time (dtHour12).
    bool hour12 = 15;
}

message WristRow {
    // HH:MM, in the browser's locale.
    string time = 1;
    string name = 2;
    string text = 3;
    bool friend = 4;
    bool favorite = 5;
    // The name's custom tag colour, or empty.
    string colour = 6;
}

// Hands an instance to the VRChat already running on this PC.
message OpenInstanceInGame {
    string launch_url = 1;
}

// Something changed in the database that a UI showing live state wants to know about.
// Each one is published after the rows are committed, so a REST read right after sees it.
message ServerEvent {
    google.protobuf.Timestamp at = 1;
    oneof event {
        PresenceChanged presence = 10;
        UserChanged user = 11;
        FriendshipChanged friendship = 12;
        NotificationReceived notification = 13;
        InstanceVisitChanged visit = 14;
        AccountSessionChanged account = 15;
        DesktopChanged desktop = 16;
        ContentChanged content = 17;
        GameLogStored game_log = 18;
        InstanceQueueChanged instance_queue = 19;
        CreditsChanged credits = 20;
        YouTubeBotError youtube_bot_error = 21;
        AccountContentRefreshed content_refresh = 22;
        NowPlayingPosition now_playing_position = 23;
        CustomTagChanged custom_tag = 24;
        AgentAlert agent_alert = 25;
        PhotonUpdated photon = 26;
        NowPlayingSpec now_playing_spec = 27;
    }
}

// The PC's Photon lobby changed: pages showing it fetch it again. Notys carries what the original
// notified about without storing it (ChatBoxMessage, AvatarChange, Blocked, Muted and the rest),
// as a JSON array of { type, created_at, userId, displayName, text, ... }.
message PhotonUpdated {
    string account_id = 1;
    string notys_json = 2;
}

// Something the PC's agent did, or could not do, that the original told the user about in a
// dialog (runCheckVRChatDebugLoggingFlow).
message AgentAlert {
    string account_id = 1;
    AgentAlertKind kind = 2;
    // What it is about: for SAVE_MEDIA_BLOCKED, "print", "sticker" or "emoji".
    string detail = 3;
}

enum AgentAlertKind {
    AGENT_ALERT_KIND_UNSPECIFIED = 0;
    // VRChat's debug logging was off and the agent turned it back on.
    AGENT_ALERT_KIND_DEBUG_LOGGING_ENABLED = 1;
    // It was off and could not be turned on: the user has to.
    AGENT_ALERT_KIND_DEBUG_LOGGING_FAILED = 2;
    // Windows kept the agent from writing a saved print, sticker or emoji (handleFileSaveError).
    AGENT_ALERT_KIND_SAVE_MEDIA_BLOCKED = 3;
}

// Another program on the account's PC set or removed a user's custom tag over the named pipe, or
// cleared them all (the original's customUserTags). The user dialog shows the tag in its colour.
message CustomTagChanged {
    string account_id = 1;
    // Empty when cleared is set.
    string user_id = 2;
    // Empty when the tag was removed.
    string tag = 3;
    string colour = 4;
    bool cleared = 5;
}

// A dance or cinema world logged the video already playing again with a new position (a seek, a
// resume): the status bar's Now Playing moves to it, as the original's setNowPlaying does. Not stored.
message NowPlayingPosition {
    string account_id = 1;
    string video_url = 2;
    double video_pos = 3;
    double video_length = 4;
    google.protobuf.Timestamp logged_at = 5;
}

// What a world's ProTV "nowplaying" producers say plays (the original's nowPlayingSpec): the
// followed producer's media and timing, or cleared. Not stored; the play itself is a VideoPlay row.
message NowPlayingSpec {
    string account_id = 1;
    bool cleared = 2;
    string video_url = 3;
    string name = 4;
    string thumbnail_url = 5;
    double length = 6;
    double speed = 7;
    bool paused = 8;
    // The position at logged_at.
    double position = 9;
    google.protobuf.Timestamp logged_at = 10;
    bool url_hidden = 11;
}

// VRChat's content-refresh pipeline event: the account's icons, gallery, emoji, prints or inventory
// changed, so an open gallery reloads that tab (the original's websocket content-refresh).
message AccountContentRefreshed {
    string account_id = 1;
    string content_type = 2;
    string action_type = 3;
}

// The game just logged YouTube's "Sign in to confirm" video error (the original's
// checkYoutubeBotError): the page offers VRCVideoCacher, which works around it.
message YouTubeBotError {
    string account_id = 1;
    string message = 2;
}

// VRChat's economy-update: the account's VRC Credits balance, shown on its own profile.
message CreditsChanged {
    string account_id = 1;
    optional int64 balance = 2;
}

// The account's place in an instance's join queue changed (VRChat's instance-queue-joined and
// -position), or it left the queue (-left, -ready, or moving elsewhere). The original's queue toasts.
message InstanceQueueChanged {
    string account_id = 1;
    string location = 2;
    int32 position = 3;
    int32 queue_size = 4;
    string world_name = 5;
    string group_name = 6;
    // Out of the queue; removed_by_move when it was dropped because the account went to another instance.
    bool left = 7;
    bool removed_by_move = 8;
}

// A desktop app's game log stored rows other than stays (videos, events, portal and sticker spawns,
// resource loads); stays already come as InstanceVisitChanged. Game log views reload.
message GameLogStored {
    string account_id = 1;
    string instance_location = 2;
    // video, event, portal, sticker, resource
    repeated string kinds = 3;
}

// A world, group or avatar row was created or updated, from any path: the pipeline, a sync, a
// page's refresh or a scheduled refresh. Pages showing it reload.
message ContentChanged {
    // world, group, avatar
    string kind = 1;
    string id = 2;
    string name = 3;
}

// A desktop app connected or disconnected, or VRChat started or stopped on its PC.
message DesktopChanged {
    string client_id = 1;
    bool connected = 2;
    bool game_running = 3;
    // VRChat last started in desktop mode on this PC (its log's desktop-mode line, cleared by openvr-init).
    bool game_no_vr = 4;
}

// A user came online / went active / went offline / moved instance.
message PresenceChanged {
    string user_id = 1;
    string display_name = 2;
    // online, active, offline, location - the presence_kind.
    string kind = 3;
    // online, active, offline - the user's state after this.
    string state = 4;
    string location = 5;
    string previous_location = 6;
    string traveling_to_location = 7;
    // Set when location is a real instance (the instances row key).
    string instance_location = 8;
    string platform = 9;
}

// Profile data changed (one or more of the user_* change tables got a row).
message UserChanged {
    string user_id = 1;
    string display_name = 2;
    // display_name, trust, status, bio, avatar
    repeated string changed = 3;
}

message FriendshipChanged {
    string owner_user_id = 1;
    string friend_user_id = 2;
    string display_name = 3;
    // true = friendship opened, false = ended.
    bool is_friend = 4;
    int32 friend_number = 5;
}

message NotificationReceived {
    string owner_user_id = 1;
    string notification_id = 2;
    int32 version = 3;
    string type = 4;
    string sender_user_id = 5;
    string sender_display_name = 6;
    string title = 7;
    string message = 8;
}

// Someone joined or left an instance (from the pipeline, the game log, or an API fetch).
message InstanceVisitChanged {
    string user_id = 1;
    string display_name = 2;
    string instance_location = 3;
    string world_id = 4;
    bool joined = 5;
    // pipeline, game_log, api
    string source = 6;
}

// An account logged in, was resumed, or lost its session.
message AccountSessionChanged {
    string account_id = 1;
    string display_name = 2;
    bool session_valid = 3;
    // The server logging in again with saved credentials after the session expired: "attempting"
    // (after auto_login_delay seconds), "success", "failed", or "invalid" (VRChat refused the saved
    // password, so it was removed). Empty for any other change.
    string auto_login = 4;
    uint32 auto_login_delay = 5;
}
