name: Agent

# Builds and tests the PC agent (agent/) on Windows and Linux. Its protobuf types come from
# server/Common/Protos, compiled in build.rs without protoc. See agent/README.md.

on:
  push:
    branches: [master]
    paths:
      - 'agent/**'
      - 'server/Common/Protos/**'
      - '.github/workflows/agent.yml'
  pull_request:
    paths:
      - 'agent/**'
      - 'server/Common/Protos/**'
      - '.github/workflows/agent.yml'
  workflow_dispatch:

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrcxd-agent-${{ runner.os }}
          path: |
            agent/target/release/vrcxd-agent.exe
            agent/target/release/vrcxd-agent
          if-no-files-found: error
