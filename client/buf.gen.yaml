# TypeScript codegen for the browser's side of the websocket contract, from the SAME .proto the
# server and the Qt desktop app compile - one source of truth. Output is gitignored and
# regenerated by `pnpm run generate` (run automatically before dev/build/check).
version: v2
inputs:
  - directory: ../server/Common/Protos
plugins:
  - local: protoc-gen-es
    out: src/lib/gen
    opt:
      - target=ts
      - import_extension=js
clean: true
