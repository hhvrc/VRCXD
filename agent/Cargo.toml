[package]
name = "vrcxd-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
png = "0.18.1"
prost = "0.14.4"
prost-types = "0.14.4"
regex = "1.13.1"
ring = "0.17.14"
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "net", "time", "sync", "macros", "io-util", "fs", "signal"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "env-filter", "ansi"] }
url = "2.5.8"
resvg = { version = "0.47", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }

[build-dependencies]
prost-build = "0.14.4"
protox = "0.10.0"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_Security", "Win32_System_WindowsProgramming", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }

[target."cfg(unix)".dependencies]
libc = "0.2"
